apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
      - name: flask-app
        image: ghcr.io/tomeksn/flask-gke-app:65059df
        ports:
        - containerPort: 5000
